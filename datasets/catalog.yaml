#   id        : 唯一标识，供 tools/download_datasets.py --name 使用
#   category  : hsi_msi | real_pairs | pansharpening | multimodal | spatiotemporal | sar_optical | downstream | city3d
#   access    : direct（可直链下载）| registration（需注册 / 申请）| cloud（网盘 / 云盘）| github
#   files     : 直链文件列表，仅 access=direct 的条目填写
# 人类可读说明见 docs/datasets.md。整理日期 2026-10-16。

